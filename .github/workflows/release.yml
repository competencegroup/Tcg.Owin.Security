name: Release

on:
  release:
    types: [published]
  
jobs:
  build:

    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Test
      run: dotnet test --no-build -c Release --verbosity normal
    - name: Pack
      run: dotnet pack -c Release
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v7
      with:
        name: my-artifact
        path: '**/*.nupkg'
        retention-days: 5
    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish
      run: dotnet nuget push src/Tcg.Owin.Security.OpenIdConnect/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      

